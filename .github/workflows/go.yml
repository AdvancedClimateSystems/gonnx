# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23

    - name: Install linter
      run: make install_lint

    - name: Lint
      run: make lint

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23

    - name: Install dependencies
      run: make install

    - name: Install Gotestsum
      run: make install_gotestsum
    
    - name: Setup ONNX test data
      run: make test_data

    - name: Tests
      run: make test

    - name: Tests without assembly kernels
      run: CGO_ENABLED=0 go test -tags purego $(go list ./... | grep -v /onnx/)

    - name: Tests with race detector
      run: CGO_ENABLED=1 go test -race $(go list ./... | grep -v /onnx/)

  # The arm and arm64 SIMD kernels are assembly, so the tests also run on those
  # architectures, emulated with QEMU.
  tests_arm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm, arm64]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup ONNX test data
      run: make test_data

    - name: Tests
      run: GOARCH=${{ matrix.goarch }} GOARM=7 CGO_ENABLED=0 go test $(go list ./... | grep -v /onnx/)

  build_amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23

    - name: Build amd64
      run: make build_amd64

  build_arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23

    - name: Build arm64
      run: make build_arm64
